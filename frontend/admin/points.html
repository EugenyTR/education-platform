<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление баллами - Админ панель</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="../index.html" class="logo">EduPlatform Admin</a>
                <nav class="nav">
                    <a href="users.html">Пользователи</a>
                    <a href="points.html">Баллы</a>
                    <a href="certificates.html">Сертификаты</a>
                </nav>
                <div class="auth-buttons">
                    <button class="btn btn-outline" id="logoutBtn">Выйти</button>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <h1>Управление баллами</h1>
            <div class="admin-forms">
                <div class="admin-card">
                    <h2>Начислить баллы</h2>
                    <form id="awardPointsForm" class="auth-form">
                        <div class="form-group">
                            <label for="userId">ID пользователя</label>
                            <input type="number" id="userId" required>
                        </div>
                        <div class="form-group">
                            <label for="amount">Количество баллов</label>
                            <input type="number" id="amount" required>
                        </div>
                        <div class="form-group">
                            <label for="reason">Причина</label>
                            <input type="text" id="reason">
                        </div>
                        <button type="submit" class="btn btn-primary">Начислить</button>
                    </form>
                </div>
                <div class="admin-card">
                    <h2>Подарить курс</h2>
                    <form id="giftCourseForm" class="auth-form">
                        <div class="form-group">
                            <label for="giftUserId">ID пользователя</label>
                            <input type="number" id="giftUserId" required>
                        </div>
                        <div class="form-group">
                            <label for="courseId">ID курса</label>
                            <input type="number" id="courseId" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Подарить</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Образовательная платформа. Все права защищены.</p>
        </div>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="points.js"></script>
</body>
</html>
