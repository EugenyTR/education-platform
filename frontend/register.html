<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Образовательная платформа</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">EduPlatform</a>
                <nav class="nav">
                    <a href="index.html">Главная</a>
                    <a href="courses.html">Курсы</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="auth-page">
            <div class="auth-container">
                <div class="auth-card">
                    <h1>Регистрация</h1>
                    <form id="registerForm" class="auth-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="name">Имя *</label>
                                <input type="text" id="name" name="name" required placeholder="Ваше имя">
                            </div>
                            <div class="form-group">
                                <label for="surname">Фамилия *</label>
                                <input type="text" id="surname" name="surname" required placeholder="Ваша фамилия">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="patronymic">Отчество</label>
                                <input type="text" id="patronymic" name="patronymic" placeholder="Ваше отчество">
                            </div>
                            <div class="form-group">
                                <label for="nickname">Никнейм</label>
                                <input type="text" id="nickname" name="nickname" placeholder="Ваш никнейм">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" name="email" required placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label for="password">Пароль *</label>
                            <input type="password" id="password" name="password" required placeholder="Придумайте пароль" minlength="6">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
                    </form>
                    <div class="auth-footer">
                        <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
